<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Demo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f5f5; padding:20px; }
.phone { width:340px; height:620px; border-radius:28px; border:3px solid #333; background:#F8F9FA; overflow:hidden; margin:0 auto; position:relative; }
.phone-notch { height:26px; background:#333; }
.screen-wrap { height:588px; position:relative; overflow:hidden; }
.screen { position:absolute; top:0; left:0; width:100%; height:100%; display:none; justify-content:center; align-items:center; flex-direction:column; padding:24px; text-align:center; }
#s1 { display:flex; background:#E8E6FF; }
#s2 { background:#fff; }
h2 { font-size:20px; margin-bottom:16px; }
.btn { padding:12px 32px; border-radius:12px; border:none; background:#6C5CE7; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
.back { background:none; border:none; font-size:18px; cursor:pointer; position:absolute; top:20px; left:20px; }
</style>
</head>
<body>
<div class="phone">
  <div class="phone-notch"></div>
  <div class="screen-wrap">
    <div class="screen" id="s1">
      <h2>Screen 1</h2>
      <button class="btn" onclick="go('s2')">Go to Screen 2</button>
    </div>
    <div class="screen" id="s2">
      <button class="back" onclick="go('s1')">← Back</button>
      <h2>Screen 2</h2>
      <button class="btn" onclick="go('s1')">Go to Screen 1</button>
    </div>
  </div>
</div>
<script>
function go(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) {
    screens[i].style.display = 'none';
  }
  document.getElementById(id).style.display = 'flex';
}
</script>
</body>
</html>
